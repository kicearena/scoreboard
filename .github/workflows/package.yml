name: Package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: bun run check && bun run test && bun run build && bun run demo:build
      - run: npm pack --dry-run
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: bun run check && bun run test && bun run build && bun run demo:build
      - run: npm pack --dry-run
      - name: Publish identical package to GitHub Packages and npm
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
          node scripts/publish.mjs
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
